name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11'
            testbench: '9'
            pest: '3'
          - php: '8.2'
            laravel: '12'
            testbench: '10'
            pest: '3'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
            pest: '4'
          - php: '8.5'
            laravel: '13'
            testbench: '11'
            pest: '4'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2.8
      - run: composer validate --strict
      - name: Select dependency versions
        run: |
          composer config minimum-stability stable
          composer require "filament/filament:^5.0" --no-update --no-interaction
          composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" "orchestra/workbench:^${{ matrix.testbench }}.0" "pestphp/pest:^${{ matrix.pest }}.0" "pestphp/pest-plugin-laravel:^${{ matrix.pest }}.0" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
      - name: Build Laravel 13 preview
        if: matrix.laravel == '13'
        run: composer build

  consumer-resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10'
            filament: '3'
          - php: '8.3'
            laravel: '13'
            filament: '3'
          - php: '8.3'
            laravel: '13'
            filament: '4'
    name: Resolve Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2.8
      - name: Prepare isolated consumer
        run: php .github/scripts/prepare-consumer.php "$RUNNER_TEMP/cyber-glass-consumer" "${{ matrix.laravel }}" "${{ matrix.filament }}"
      - name: Resolve stable consumer dependencies
        working-directory: ${{ runner.temp }}/cyber-glass-consumer
        run: composer update --dry-run --no-install --no-scripts --no-interaction --no-progress
